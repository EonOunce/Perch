<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>栖迟</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-perch" viewBox="0 0 24 24">
    <path d="M3.4 18.4c4.9 0 7.9-2.2 9.7-5.7"/>
    <path d="M8.2 20.1c3.7 0 6.8-1.9 8.8-5.3"/>
    <circle cx="16.8" cy="7.2" r="2.2"/>
    <path d="M18.7 7.4c1.6.1 2.7 1 3.5 2.4-1.4.4-2.7.1-3.8-.7"/>
    <circle cx="17.5" cy="6.7" r=".28" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-book" viewBox="0 0 24 24">
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22V5.5Z"/>
    <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22V5.5Z"/>
  </symbol>
  <symbol id="i-walk" viewBox="0 0 24 24">
    <circle cx="13.6" cy="4.6" r="2"/>
    <path d="M13.9 8.2c-1.9.7-2.6 2.4-2.7 4.3l-.5 4.4"/>
    <path d="M11.4 10.4 8 12.6l-1.4 3.4"/>
    <path d="m14 12.8 2.6 2.2.9 4.6"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M15.6 3.4a8.6 8.6 0 1 0 5 11.2A9 9 0 0 1 15.6 3.4Z"/>
  </symbol>
  <symbol id="i-sprout" viewBox="0 0 24 24">
    <path d="M20 4c-8.2 0-13.2 4-13.2 10A5.8 5.8 0 0 0 12.6 20C18.6 20 20 10.9 20 4Z"/>
    <path d="M4 20c2.7-5.8 6.7-9 11.8-11"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.3 4.3L19 7.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="10.6" cy="10.6" r="6.1"/><path d="m15.2 15.2 4.3 4.3"/>
  </symbol>
  <symbol id="i-edit" viewBox="0 0 24 24">
    <path d="M4.4 19.8h3.9L19 9.1a2.4 2.4 0 0 0-3.4-3.4L4.9 16.4v3.4Z"/>
    <path d="M14.4 6.9 17.1 9.6"/>
  </symbol>
  <symbol id="i-archive" viewBox="0 0 24 24">
    <path d="M3.8 6.4h16.4v3.1H3.8z"/>
    <path d="M5.4 9.5v8a1.5 1.5 0 0 0 1.5 1.5h10.2a1.5 1.5 0 0 0 1.5-1.5v-8"/>
    <path d="M10 12.9h4"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M4.7 6.6h14.6"/>
    <path d="M9.5 6.6V4.9a1.2 1.2 0 0 1 1.2-1.2h2.6a1.2 1.2 0 0 1 1.2 1.2v1.7"/>
    <path d="M6.5 6.6l.8 12.2a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12.2"/>
  </symbol>
  <symbol id="i-restore" viewBox="0 0 24 24">
    <path d="M19.4 12a7.4 7.4 0 1 1-2.2-5.3"/>
    <path d="M19.6 4.2v4.4h-4.4"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6.5 14.5 5.5-5.5 5.5 5.5"/></symbol>
</svg>

<main class="card" id="card">
  <section class="card-head" id="cardHead">
    <button class="brand" id="collapseBtn" type="button" aria-label="折叠卡片">
      <span class="brand-mark"><svg class="icon"><use href="#i-perch"/></svg></span>
      <span class="brand-cn">栖迟</span>
    </button>
  </section>

  <!-- 折叠态（§2.8）：横向日期栏 + 其下垂挂的竖向长条，整块替代上面的标签与内容区。 -->
  <section class="strip" id="strip" hidden>
    <header class="strip-bar" id="stripBar">
      <button class="strip-date" id="expandBtn" type="button" aria-label="展开卡片">
        <span class="brand-mark"><svg class="icon"><use href="#i-perch"/></svg></span>
        <span class="strip-day" id="stripDay">—</span>
        <span class="strip-week" id="stripWeek"></span>
        <span class="strip-count" id="stripCount" hidden></span>
      </button>
      <button class="icon-btn strip-fold" id="stripFold" type="button" aria-label="收起长条">
        <svg class="icon"><use href="#i-chevron"/></svg>
      </button>
    </header>
    <div class="strip-rows" id="stripRows"></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="栖迟视图">
    <button class="tab is-on" id="tabToday" type="button" role="tab"
            aria-selected="true" data-view="today">今天</button>
    <button class="tab" id="tabRecords" type="button" role="tab"
            aria-selected="false" data-view="records">记录</button>
    <button class="tab" id="tabStats" type="button" role="tab"
            aria-selected="false" data-view="stats">统计</button>
  </nav>

  <p class="banner" id="storageBanner" hidden></p>

  <div class="scroller" id="scroller">
    <header class="date-block">
      <h1 class="date-title" id="dateTitle">—</h1>
      <p class="date-eyebrow" id="weekLine">—</p>
    </header>


    <section class="zone review" id="reviewZone" hidden aria-live="polite"></section>

    <section class="zone">
      <div class="zone-head">
        <h2>习惯</h2>
        <button class="zone-action" id="openManage" type="button">
          <svg class="icon"><use href="#i-edit"/></svg><span>管理</span>
        </button>
      </div>
      <div class="habit-list" id="habitList"></div>
    </section>

    <section class="zone">
      <div class="zone-head"><h2>心情</h2></div>
      <div class="mood" id="moodBox">
        <div class="mood-head">
          <span class="mood-face is-unset" id="moodFace"></span>
          <span class="mood-name" id="moodName">今天还没记</span>
          <span class="mood-value" id="moodValue">—</span>
        </div>
        <input type="range" id="moodSlider" min="0" max="100" step="1" value="50"
               aria-label="今天的心情，0 到 100 百分比">
      </div>
    </section>

    <section class="zone compose">
      <div class="zone-head"><h2>碎碎念</h2></div>
      <textarea id="noteInput" rows="2" placeholder="写下一句，今天的、刚才的，都可以。"
                aria-label="碎碎念"></textarea>
      <div class="compose-foot">
        <span class="tag-preview" id="tagPreview" aria-live="polite"></span>
        <button class="save" id="noteSave" type="button" disabled>记下</button>
      </div>
    </section>

    <section class="zone">
      <div class="zone-head">
        <h2>记录</h2>
        <span class="zone-note" id="noteCount"></span>
      </div>
      <div class="note-list" id="noteList"></div>
    </section>
  </div>

  <div class="view" id="viewRecords" hidden>
    <div class="rec-tools">
      <div class="rec-search-row">
        <label class="search-box">
          <svg class="icon"><use href="#i-search"/></svg>
          <input id="recSearch" type="search" placeholder="搜索记录或 #标签"
                 autocomplete="off" aria-label="搜索记录">
        </label>
        <button class="save" id="recAdd" type="button">记一条</button>
      </div>
      <div class="tag-row" id="tagRow" role="group" aria-label="按标签筛选"></div>
      <div class="rec-meta">
        <span id="recCount"></span>
        <button class="text-btn" id="recClear" type="button" hidden>清除筛选</button>
      </div>
    </div>

    <div class="rec-undo" id="recUndo" hidden>
      <span>已移除这条记录。</span>
      <button class="text-btn" id="recUndoBtn" type="button">撤销</button>
    </div>

    <div class="scroller" id="recScroll">
      <div class="rec-list" id="recList"></div>
    </div>
  </div>

  <div class="view" id="viewStats" hidden>
    <div class="stat-tools">
      <div class="scope-row" id="statScope" role="group" aria-label="统计的习惯范围"></div>
      <div class="range-row" id="statRange" role="group" aria-label="统计时间范围">
        <button class="range-btn" type="button" data-range="7">7 天</button>
        <button class="range-btn" type="button" data-range="30">30 天</button>
        <button class="range-btn" type="button" data-range="90">90 天</button>
        <button class="range-btn" type="button" data-range="month">本月</button>
        <button class="range-btn" type="button" data-range="lastMonth">上月</button>
        <button class="range-btn" type="button" data-range="custom">自定义</button>
      </div>
      <p class="range-caption" id="statCaption">—</p>
      <div class="custom-row" id="statCustom" hidden>
        <label class="date-field"><span>从</span><input id="statFrom" type="date" aria-label="起始日期"></label>
        <span class="date-dash">–</span>
        <label class="date-field"><span>到</span><input id="statTo" type="date" aria-label="结束日期"></label>
        <button class="save stat-apply" id="statApply" type="button">应用</button>
      </div>
      <p class="stat-error" id="statError" hidden aria-live="polite"></p>
    </div>

    <div class="scroller" id="statScroll">
      <div id="statBody"></div>
    </div>
  </div>

  <div class="fade" aria-hidden="true"></div>

  <div class="sheet" id="panel" hidden>
    <div class="sheet-body">
      <div class="sheet-head">
        <h3>习惯管理</h3>
        <button class="zone-action" id="panelAdd" type="button">
          <svg class="icon"><use href="#i-plus"/></svg><span>新增</span>
        </button>
        <button class="icon-btn" id="panelClose" type="button" aria-label="关闭管理面板">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>
      <div class="panel-list" id="panelList"></div>
    </div>
  </div>

  <div class="sheet" id="noteSheet" hidden>
    <form class="sheet-body" id="noteForm">
      <div class="sheet-head">
        <h3 id="noteSheetTitle">记一条</h3>
        <button class="icon-btn" id="noteSheetClose" type="button" aria-label="关闭">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>

      <label class="field">
        <textarea id="fNoteText" rows="4" placeholder="写下一句，今天的、刚才的，都可以。"
                  aria-label="记录正文"></textarea>
      </label>
      <div class="tag-preview" id="noteTagPreview"></div>

      <div class="sheet-foot">
        <button class="text-btn" id="noteCancel" type="button">取消</button>
        <button class="save" id="noteSheetSave" type="submit" disabled>保存</button>
      </div>
    </form>
  </div>

  <div class="sheet" id="sheet" hidden>
    <form class="sheet-body" id="habitForm">
      <div class="sheet-head">
        <h3 id="sheetTitle">新增习惯</h3>
        <button class="icon-btn" id="sheetClose" type="button" aria-label="关闭表单">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>

      <label class="field">
        <span>名称<em>必填</em></span>
        <input id="fName" maxlength="24" placeholder="散步" required>
      </label>

      <label class="field">
        <span>怎样算完成一次</span>
        <textarea id="fDef" rows="2" placeholder="留空也可以"></textarea>
      </label>

      <label class="field">
        <span>如果…就…</span>
        <textarea id="fIfThen" rows="2" placeholder="什么时候提醒自己开始"></textarea>
      </label>

      <div class="field-row" id="fUnitRow">
        <label class="field">
          <span>单位</span>
          <input id="fUnit" maxlength="6" placeholder="次">
        </label>
        <label class="field" id="fCountWrap">
          <span>每次</span>
          <input id="fCount" type="number" min="1" max="99" step="1" placeholder="1">
        </label>
      </div>

      <div class="field">
        <span>什么时候确认</span>
        <div class="seg" id="fTiming" role="group" aria-label="确认时机">
          <button type="button" data-value="sameDay" class="is-on">当天打卡</button>
          <button type="button" data-value="nextDay">次日确认</button>
        </div>
      </div>

      <div class="field">
        <span>目标</span>
        <div class="seg" id="fMode" role="group" aria-label="目标方式">
          <button type="button" data-value="weekly" class="is-on">按周计</button>
          <button type="button" data-value="recordOnly">只记录</button>
        </div>
      </div>

      <label class="field" id="fWeeklyWrap">
        <span>每周几</span>
        <input id="fWeekly" type="number" min="1" max="7" step="1" placeholder="3">
      </label>

      <p class="sheet-hint" id="goalHint" hidden>目标改动从下一个周一起生效，本周照旧。</p>

      <div class="sheet-foot">
        <button class="save" type="submit">保存</button>
      </div>
    </form>
  </div>

  <p class="toast" id="toast" aria-live="polite"></p>
</main>

<script src="app.js"></script>
<script src="motion.js"></script>
<script src="manage.js"></script>
<script src="views.js"></script>
<script src="records.js"></script>
<script src="stats.js"></script>
<script src="collapse.js"></script>
</body>
</html>

[package]
name = "perch"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 托盘需要 tray-icon 这个 feature（Tauri 2 里它不在默认特性里）；菜单与托盘图标都由它带进来。
tauri = { version = "2", features = ["tray-icon"] }
perch-core = { path = "../crates/perch-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 稳定 ID：合并按 id 取并集（DESIGN §4.5），所以 ID 必须跨设备唯一。
# 唯一备选是手写随机十六进制，那只是把「会不会撞」换成「我数对了没」。
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 同步的 HTTP 客户端。TLS 只用 Windows 自带的 schannel（native-tls）：
# 不往安装包里再塞一套 rustls，证书校验也跟系统根证书走（DESIGN §4.2）。
ureq = { version = "3.5.0", default-features = false, features = ["native-tls"] }
# Basic 认证头用；ureq 已经间接依赖它，这里只是显式写出来。
base64 = "0.23"

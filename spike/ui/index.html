<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
<meta charset="utf-8">
<title>Perch 桌面层探针</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 14px/1.5 "Segoe UI", sans-serif; color: #3f3a33; }
  #card { box-sizing: border-box; height: 100%; padding: 14px 16px; background: #f6f1e7; border: 1px solid #d8d0c0; border-radius: 14px; box-shadow: 0 6px 18px rgba(63,58,51,.18); display: flex; flex-direction: column; }
  #head { -webkit-user-select: none; user-select: none; font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  button, input { font: inherit; color: #3f3a33; background: #fdfaf3; border: 1px solid #c9c0ae; border-radius: 8px; padding: 6px 9px; }
  #out { flex: 1; white-space: pre-wrap; overflow: auto; font: 12px/1.45 ui-monospace, Consolas, monospace; color: #6b6459; border-top: 1px dashed #c9c0ae; padding-top: 6px; }
</style>
</head>
<body>
<div id="card">
  <div id="head" data-tauri-drag-region>栖迟 · 桌面层探针</div>
  <div class="row">
    <button data-cmd="probe_status">状态</button>
    <button data-cmd="probe_embed">嵌入</button>
    <button data-cmd="probe_unembed">还原</button>
    <button data-cmd="probe_cycle">重挂</button>
    <button data-cmd="probe_shift">挪一点</button>
    <button data-cmd="probe_shot">抓图</button>
    <button data-cmd="probe_shell_event">模拟Explorer重启</button>
    <input id="type" placeholder="打字测试">
    <button data-cmd="probe_quit">退出</button>
  </div>
  <div id="out">等待…</div>
</div>
<script>
  const out = document.getElementById('out');
  const log = (m) => { out.textContent = out.textContent.replace(/^等待…/, '') + '\n' + m; out.scrollTop = out.scrollHeight; };
  const invoke = (cmd) => window.__TAURI__.core.invoke(cmd).then(
    (r) => log(`${cmd} → ${r}`),
    (e) => log(`${cmd} ERR ${e}`)
  );
  document.querySelectorAll('button[data-cmd]').forEach((b) => {
    b.addEventListener('click', () => invoke(b.dataset.cmd));
  });
  window.addEventListener('error', (e) => log('JS-ERR ' + e.message));
  setInterval(() => invoke('probe_status'), 3000);
  log('页面已加载');
</script>
</body>
</html>
